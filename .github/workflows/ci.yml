name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @fullstack-webapp/local-edge-demo exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test SDK and package boundaries
        run: pnpm test

      - name: Test release package mapping
        run: pnpm test:release-version

      - name: Build and test browser lifecycle
        run: pnpm e2e

      - name: Test Pages hosting contract
        run: pnpm test:hosting

      - name: Verify package contents
        run: pnpm pack:check

      - name: Build an isolated packed consumer
        run: pnpm test:packed-consumer
