name: Prepare release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release (local-edge or document-shell)
        required: true
        type: choice
        options:
          - local-edge
          - document-shell
      version:
        description: Exact next package version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create release bot token
        id: release-bot-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FWA_KIT_RELEASE_APP_ID }}
          private-key: ${{ secrets.FWA_KIT_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.release-bot-token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve release package
        id: package
        run: |
          set -euo pipefail
          case "${{ inputs.package }}" in
            local-edge)
              echo "key=local-edge" >> "$GITHUB_OUTPUT"
              echo "name=@fullstack-webapp/local-edge" >> "$GITHUB_OUTPUT"
              echo "directory=packages/local-edge" >> "$GITHUB_OUTPUT"
              ;;
            document-shell)
              echo "key=document-shell" >> "$GITHUB_OUTPUT"
              echo "name=@fullstack-webapp/document-shell" >> "$GITHUB_OUTPUT"
              echo "directory=packages/document-shell" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown release package: ${{ inputs.package }}" >&2
              exit 1
              ;;
          esac

      - name: Validate release claim and availability
        env:
          PACKAGE: ${{ steps.package.outputs.key }}
          VERSION: ${{ inputs.version }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          node scripts/validate-release.mjs "$PACKAGE" "$VERSION"

          branch="release/$PACKAGE-$VERSION"
          tag="$PACKAGE@$VERSION"

          branch_ref="$(git ls-remote --heads origin "refs/heads/$branch")"
          if [ -n "$branch_ref" ]; then
            echo "Release branch already exists: $branch" >&2
            exit 1
          fi

          tag_ref="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [ -n "$tag_ref" ]; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi

          set +e
          npm view "$PACKAGE_NAME@$VERSION" version --json > registry-result.txt 2>&1
          registry_status=$?
          set -e

          if [ "$registry_status" -eq 0 ]; then
            cat registry-result.txt
            echo "Package version already exists in npm: $VERSION" >&2
            exit 1
          fi

          if ! grep -q 'E404' registry-result.txt; then
            cat registry-result.txt >&2
            echo 'Could not prove that the target version is absent from npm.' >&2
            exit 1
          fi

      - name: Create release branch and pull request
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}
          PACKAGE: ${{ steps.package.outputs.key }}
          VERSION: ${{ inputs.version }}
          DIRECTORY: ${{ steps.package.outputs.directory }}
        run: |
          set -euo pipefail
          branch="release/$PACKAGE-$VERSION"
          (
            cd "$DIRECTORY"
            npm version "$VERSION" --no-git-tag-version --ignore-scripts --workspaces=false
          )
          git diff --check

          if [ "$(git diff --name-only)" != "$DIRECTORY/package.json" ]; then
            echo 'Release preparation changed files other than the package version claim.' >&2
            git diff --name-only >&2
            exit 1
          fi

          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIRECTORY/package.json"
          git diff --cached --quiet && {
            echo 'Release claim did not change package metadata.' >&2
            exit 1
          }
          git commit -m "chore: prepare $PACKAGE $VERSION"
          git push origin "HEAD:refs/heads/$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: prepare $PACKAGE $VERSION" \
            --body "Prepare \`$PACKAGE@$VERSION\` from the current default branch. This PR changes only the package version claim. It does not publish, tag, or update consumers. The prepare workflow has checked SemVer precedence, remote branch/tag absence, and npm version absence."
