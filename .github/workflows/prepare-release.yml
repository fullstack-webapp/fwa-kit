name: Prepare Local Edge release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact next @fullstack-webapp/local-edge version
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: prepare-local-edge-release
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release claim and availability
        run: |
          set -euo pipefail
          node scripts/validate-local-edge-release.mjs "$VERSION"

          branch="release/local-edge-$VERSION"
          tag="local-edge@$VERSION"

          branch_ref="$(git ls-remote --heads origin "refs/heads/$branch")"
          if [ -n "$branch_ref" ]; then
            echo "Release branch already exists: $branch" >&2
            exit 1
          fi

          tag_ref="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [ -n "$tag_ref" ]; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi

          set +e
          npm view "@fullstack-webapp/local-edge@$VERSION" version --json > registry-result.txt 2>&1
          registry_status=$?
          set -e

          if [ "$registry_status" -eq 0 ]; then
            cat registry-result.txt
            echo "Package version already exists in npm: $VERSION" >&2
            exit 1
          fi

          if ! grep -q 'E404' registry-result.txt; then
            cat registry-result.txt >&2
            echo 'Could not prove that the target version is absent from npm.' >&2
            exit 1
          fi

      - name: Create release branch and pull request
        run: |
          set -euo pipefail
          branch="release/local-edge-$VERSION"
          (
            cd packages/local-edge
            npm version "$VERSION" --no-git-tag-version --ignore-scripts --workspaces=false
          )
          git diff --check

          if [ "$(git diff --name-only)" != 'packages/local-edge/package.json' ]; then
            echo 'Release preparation changed files other than the package version claim.' >&2
            git diff --name-only >&2
            exit 1
          fi

          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/local-edge/package.json
          git diff --cached --quiet && {
            echo 'Release claim did not change package metadata.' >&2
            exit 1
          }
          git commit -m "chore: prepare local edge $VERSION"
          git push origin "HEAD:refs/heads/$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: prepare local edge $VERSION" \
            --body "Prepare \`@fullstack-webapp/local-edge@$VERSION\` from the current default branch. This PR changes only the package version claim. It does not publish, tag, or update consumers. The prepare workflow has checked SemVer precedence, remote branch/tag absence, and npm version absence; CI is dispatched for this release branch head."

      - name: Dispatch release-branch CI
        run: |
          gh workflow run ci.yml --ref "release/local-edge-$VERSION"
