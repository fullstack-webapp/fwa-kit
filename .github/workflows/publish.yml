name: Publish

on:
  push:
    tags:
      - "local-edge@*"
      - "document-shell@*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish

    steps:
      - name: Resolve tagged package
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            local-edge@*)
              echo "key=local-edge" >> "$GITHUB_OUTPUT"
              echo "name=@fullstack-webapp/local-edge" >> "$GITHUB_OUTPUT"
              echo "directory=packages/local-edge" >> "$GITHUB_OUTPUT"
              ;;
            document-shell@*)
              echo "key=document-shell" >> "$GITHUB_OUTPUT"
              echo "name=@fullstack-webapp/document-shell" >> "$GITHUB_OUTPUT"
              echo "directory=packages/document-shell" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported release tag prefix: $TAG" >&2
              exit 1
              ;;
          esac

      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag and default-branch source
        env:
          TAG: ${{ github.ref_name }}
          PACKAGE: ${{ steps.package.outputs.key }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse origin/main)"
          test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          node scripts/validate-release.mjs verify "$TAG" "$PACKAGE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup npm trusted-publishing client
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @fullstack-webapp/local-edge-demo exec playwright install --with-deps chromium

      - name: Verify release source and package
        run: pnpm run ci

      - name: Publish ${{ steps.package.outputs.name }}
        working-directory: ${{ steps.package.outputs.directory }}
        run: npm publish --access public --tag beta --provenance
